editions:
  taiwan:
    label: Taiwan
    output_language: Traditional Chinese (Taiwan)
    language_code: zh-TW
    whisper_language: zh
    default_project_suffix: Taiwan Finance Daily
    default_voice: zh-TW-HsiaoChenNeural
    default_subtitle_font: Microsoft JhengHei
    subtitle_max_words: 12
    subtitle_max_characters: 18
    subtitle_min_characters: 6
    subtitle_fonts:
      - Microsoft JhengHei
      - Noto Sans CJK TC
      - Segoe UI
      - Arial
    voices:
      - zh-TW-HsiaoChenNeural
      - zh-TW-YunJheNeural
      - zh-TW-HsiaoYuNeural
    research_focus: |
      Build the briefing for investors and economically engaged viewers in Taiwan.
      Lead with Taiwan equities, TAIEX, Taiwan-listed companies, semiconductors,
      electronics supply chains, the New Taiwan dollar, Taiwan interest rates,
      exports, manufacturing, property, and policy developments. Also include
      overseas events when they can materially affect Taiwan, especially the
      United States, China, Japan, the Japanese yen, global rates, oil, shipping,
      AI demand, and semiconductor demand. Do not force a Taiwan angle onto an
      event with no meaningful Taiwan transmission channel.
    audience_note: Taiwan-based viewers; use Taiwan market terminology and Traditional Chinese.
    script_language_rule: Write all narration in natural Traditional Chinese used in Taiwan. Avoid Simplified Chinese vocabulary. Explain foreign-market terms clearly when first introduced.
    search_query_rule: Keep visual search queries in concise English whenever possible because international media catalogs retrieve better results in English.
  japan:
    label: Japan
    output_language: Japanese
    language_code: ja-JP
    whisper_language: ja
    default_project_suffix: Japan Finance Daily
    default_voice: ja-JP-KeitaNeural
    default_subtitle_font: Yu Gothic
    subtitle_max_words: 12
    subtitle_max_characters: 20
    subtitle_min_characters: 6
    subtitle_fonts:
      - Yu Gothic
      - Meiryo
      - Noto Sans CJK JP
      - Segoe UI
      - Arial
    voices:
      - ja-JP-KeitaNeural
      - ja-JP-NanamiNeural
      - ja-JP-AoiNeural
      - ja-JP-DaichiNeural
    research_focus: |
      Build the briefing for investors and economically engaged viewers in Japan.
      Lead with the Nikkei 225, TOPIX, Japanese companies, the yen, Bank of Japan,
      JGB yields, wages, inflation, exports, autos, trading houses, technology,
      and domestic policy. Include global events when they materially affect
      Japan, especially United States rates, China demand, energy prices,
      semiconductors, shipping, and foreign-exchange moves.
    audience_note: Japan-based viewers; use standard financial Japanese.
    script_language_rule: Write all narration in natural, broadcast-quality Japanese. Define specialist English terms briefly when needed.
    search_query_rule: Keep visual search queries in concise English whenever possible; use Japanese proper nouns only when they improve retrieval.
  global:
    label: Global
    output_language: English
    language_code: en-US
    whisper_language: en
    default_project_suffix: Global Finance Daily
    default_voice: en-US-AndrewNeural
    default_subtitle_font: Arial
    subtitle_max_words: 10
    subtitle_max_characters: 58
    subtitle_min_characters: 4
    subtitle_fonts:
      - Arial
      - Segoe UI
      - Tahoma
      - Verdana
      - Times New Roman
    voices:
      - en-US-AndrewNeural
      - en-US-BrianNeural
      - en-US-GuyNeural
      - en-US-AriaNeural
      - en-US-JennyNeural
      - en-GB-RyanNeural
      - en-GB-SoniaNeural
    research_focus: |
      Build a globally balanced briefing for an international investing audience.
      Prioritize events with broad cross-asset or cross-border consequences.
      Cover the United States, Europe, China, Japan, major emerging markets,
      commodities, currencies, rates, global technology, and geopolitics without
      over-weighting one country unless the market impact justifies it.
    audience_note: International viewers; use clear global financial English.
    script_language_rule: Write all narration in natural spoken English suitable for an international audience.
    search_query_rule: Write concise English visual search queries.
